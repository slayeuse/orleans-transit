name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.0'
          cache: true

      - name: Générer le projet Android
        run: |
          flutter create --platforms=android --org fr.laurent --project-name transit_orleans .
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$M"
          sed -i 's#android:label="transit_orleans"#android:label="Orléans Transit"#' "$M"
          grep -q 'screenOrientation' "$M" || sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' "$M"
          cat "$M"
  
      - name: Clé de signature fixe
        run: |
          mkdir -p ~/.android
          if [ -f ci/debug.keystore ]; then cp ci/debug.keystore ~/.android/debug.keystore; fi
   
      - name: Dépendances
        run: flutter pub get

      - name: Compiler l'APK
        env:
          SNCF_API_KEY: ${{ secrets.SNCF_API_KEY }}
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: flutter build apk --release --dart-define=SNCF_API_KEY="$SNCF_API_KEY" --dart-define=CARTO_API_KEY="$CARTO_API_KEY"

      - name: Archiver l'APK
        uses: actions/upload-artifact@v4
        with:
          name: orleans-transit-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Orléans Transit — version ${{ github.run_number }}
          body: Télécharger app-release.apk sur le téléphone puis l'installer.
          files: build/app/outputs/flutter-apk/app-release.apk
